name: Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: HTML Validation & Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all HTML files exist
        run: |
          pages=(index.html features.html how-it-works.html mealobox-sync.html for-providers.html data-security.html terms.html)
          for page in "${pages[@]}"; do
            if [ ! -f "$page" ]; then
              echo "❌ Missing: $page"
              exit 1
            else
              echo "✅ Found: $page"
            fi
          done

      - name: Check for Lorem ipsum placeholder text
        run: |
          if grep -r "Lorem ipsum" --include="*.html" .; then
            echo "❌ Found placeholder text 'Lorem ipsum' — remove before merging."
            exit 1
          else
            echo "✅ No Lorem ipsum found."
          fi

      - name: Check copyright line in all HTML files
        run: |
          pages=(index.html features.html how-it-works.html mealobox-sync.html for-providers.html data-security.html terms.html)
          for page in "${pages[@]}"; do
            if ! grep -q "MealOBox Foodtech" "$page"; then
              echo "❌ Missing copyright/footer in: $page"
              exit 1
            else
              echo "✅ Footer present: $page"
            fi
          done

  deploy-staging:
    name: Deploy to Staging (S3)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync to S3 (staging)
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET_STAGING }} \
            --exclude ".git/*" \
            --exclude "_components.html" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude "CODEOWNERS" \
            --exclude ".gitignore" \
            --delete

      - name: Invalidate CloudFront (staging)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DISTRIBUTION_STAGING }} \
            --paths "/*"

      - name: Notify deployment
        run: echo "✅ Deployed to staging — https://staging.dailydose.mealobox.in"
